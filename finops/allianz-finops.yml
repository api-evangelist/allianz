meters:
  - name: partner_contract
    description: Master partner contract — not metered per API call; economics flow through underlying policy / assistance product pricing.
    unit: contract
    aggregation: count
    dimensions:
      - partner
      - region
principles:
  - name: Visibility
    description: Track Allianz partner cost through the underlying insurance / assistance invoice rather than through API consumption data.
  - name: Allocation
    description: Allocate partner cost to the embedding product line (e.g., travel platform's travel-insurance attach revenue and cost).
  - name: Optimization
    description: Optimize by aligning embedded-insurance product mix to attach rate and loss-ratio targets; no API-level metering.
  - name: Accountability
    description: Partnership and product owners on each side own the commercial relationship; finance reconciles partner invoices.
